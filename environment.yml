# Python environment of the experiments (Linux x86_64). The runs used the CUDA 12.6 build of torch. On a CUDA
# machine install it with: pip install torch==2.12.1 --index-url https://download.pytorch.org/whl/cu126
# The table and figure scripts need numpy, pandas, scipy, matplotlib and pillow, and LaTeX for the figures.
# The model server ran in its own environment (wafer/orchestration/VLLM_SERVER.md).
